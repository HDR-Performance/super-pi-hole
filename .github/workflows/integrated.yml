name: Integrated DNS release
on:
  push:
    branches: ['release/integrated-0.3']
    tags: ['v0.3.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && node tools/verify-upstream.mjs && npm test && npx tsc --noEmit
      - run: docker build -f deploy/Dockerfile.integrated -t super-pi-hole:ci .
      - run: docker compose -f deploy/truenas-upgrade.yaml config --quiet
      - run: bash deploy/smoke-integrated.sh super-pi-hole:ci
      - name: Publish tested integrated image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag super-pi-hole:ci "ghcr.io/hdr-performance/super-pi-hole:$VERSION"
          docker push "ghcr.io/hdr-performance/super-pi-hole:$VERSION"
          docker image inspect "ghcr.io/hdr-performance/super-pi-hole:$VERSION" --format '{{index .RepoDigests 0}}' > image-digest.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Super Pi Hole $VERSION — integrated DNS" \
            --notes-file docs/RELEASE-0.3.0.md deploy/truenas-upgrade.yaml image-digest.txt
