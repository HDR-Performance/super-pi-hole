name: Integrated DNS release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new immutable test release after all integrated checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: integrated-release
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Check release target is new
        if: inputs.publish
        run: |
          test "$GITHUB_REF" = refs/heads/main
          VERSION=$(node -p 'require("./package.json").version')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test$ ]]
          if git ls-remote --exit-code origin "refs/tags/v$VERSION"; then
            echo "Refusing to replace an existing tag"; exit 1
          fi
          test -f "docs/RELEASE-${VERSION%-test}.md"
      - run: npm ci && node tools/verify-upstream.mjs && npm test && npx tsc --noEmit
      - run: docker build -f deploy/Dockerfile.integrated -t super-pi-hole:ci .
      - run: docker compose -f deploy/truenas-fresh-all-in-one.yaml config --quiet && docker compose -f deploy/truenas-upgrade.yaml config --quiet && docker compose -f deploy/truenas-existing-app.yaml config --quiet
      - run: bash deploy/smoke-integrated.sh super-pi-hole:ci
      - run: node deploy/check-web-assets.mjs http://127.0.0.1:20721
      - name: Publish tested integrated image and immutable release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag super-pi-hole:ci "ghcr.io/hdr-performance/super-pi-hole:$VERSION"
          docker push "ghcr.io/hdr-performance/super-pi-hole:$VERSION"
          docker image inspect "ghcr.io/hdr-performance/super-pi-hole:$VERSION" --format '{{index .RepoDigests 0}}' > image-digest.txt
          node deploy/release-assets.mjs
          docker compose -f super-pi-hole-truenas-upgrade.yaml config --quiet
          docker compose -f super-pi-hole-existing-app-upgrade.yaml config --quiet
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$VERSION" --verify-tag --prerelease --title "Super Pi Hole $VERSION — integrated DNS and optional Super Lan-Cache" \
            --notes-file "docs/RELEASE-${VERSION%-test}.md" super-pi-hole-truenas-fresh.yaml super-pi-hole-existing-app-upgrade.yaml super-pi-hole-truenas-upgrade.yaml image-digest.txt SHA256SUMS.txt branding/icon.png branding/icon.svg
