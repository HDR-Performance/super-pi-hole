# Direct container install: no application upload, extraction, or build steps.
# Create a NEW app named super-pi-hole. Do not edit the existing pihole app.
# Replace /mnt/POOL/APPS/Super-Pi-Hole with your existing dedicated dataset.
# Replace 192.0.2.10 with your NAS LAN IP, and set a separate admin password.
# Only the new dataset's data subdirectory is initialized; never use Pi-hole data.
services:
  init-data:
    image: ghcr.io/hdr-performance/super-pi-hole:0.2.1-test
    user: '0:0'
    restart: 'no'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command: [node, /app/deploy/init-data.mjs]
    volumes:
      - type: bind
        source: /mnt/POOL/APPS/Super-Pi-Hole/data
        target: /data
        bind:
          create_host_path: true
  super-pi-hole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.2.1-test
    user: '568:568'
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - '192.0.2.10:20721:8080'
    environment:
      PUBLIC_ORIGIN: 'http://192.0.2.10:20721'
      SUPER_PIHOLE_PASSWORD: 'CHANGE_ME_TO_A_UNIQUE_16_CHARACTER_PASSWORD'
      PIHOLE_URL: 'http://192.0.2.10:20720'
      PIHOLE_PASSWORD: ''
      PIHOLE_WRITE_ENABLED: 'false'
      TZ: Etc/UTC
    volumes:
      - type: bind
        source: /mnt/POOL/APPS/Super-Pi-Hole/data
        target: /data
        bind:
          create_host_path: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
x-portals:
  - host: 192.0.2.10
    name: Web UI
    path: /
    port: 20721
    scheme: http
