# Fresh single-app install. All persistent data lives under one dataset root:
# /mnt/tank/apps/super-pi-hole
services:
  pihole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.2-test
    user: '0:0'
    network_mode: host
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETFCAP, SETGID, SETPCAP, SETUID, SYS_NICE, SYS_TIME]
    group_add: [568]
    command: [bash, /app/deploy/start-dns.sh]
    environment:
      TZ: Etc/UTC
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
      FTLCONF_webserver_api_password: ''
    volumes:
      - type: bind
        source: /mnt/tank/apps/super-pi-hole/pihole-config
        target: /etc/pihole
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/tank/apps/super-pi-hole/dnsmasq
        target: /etc/dnsmasq.d
        bind: {create_host_path: false}
    shm_size: 64M
    cpus: 2
    mem_limit: 4096M
    healthcheck:
      test: [CMD-SHELL, 'dig +short +norecurse +retry=0 +time=2 @127.0.0.1 pi.hole >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  super-pi-hole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.2-test
    command: [sh, -c, 'set -o pipefail; node server/runtime.mjs 2>&1 | tee /data/gui-startup.log']
    user: '568:568'
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      pihole: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: '20721'
      PUBLIC_ORIGIN: 'http://192.168.1.10:20721'
      SUPER_PIHOLE_AUTH_DISABLED: 'true'
      SUPER_PIHOLE_INTEGRATED: 'true'
      PIHOLE_URL: 'http://127.0.0.1:20720'
      PIHOLE_PASSWORD: ''
      PIHOLE_WRITE_ENABLED: 'true'
      TZ: Etc/UTC
    volumes:
      - type: bind
        source: /mnt/tank/apps/super-pi-hole/data
        target: /data
        bind: {create_host_path: false}
    tmpfs: ['/tmp:size=64m,mode=1777']
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
x-portals:
  - host: 192.168.1.10
    name: Web UI
    path: /
    port: 20721
    scheme: http
x-notes: >
  Super Pi Hole 0.4.2-test integrated build. One TrueNAS app contains the DNS
  engine and main GUI. All persistent files live under
  /mnt/tank/apps/super-pi-hole. Router DNS is 192.168.1.10 on port 53; Web UI is
  http://192.168.1.10:20721/. The controller opens without a password on this trusted-LAN template. The
  original Pi-hole API is bound to loopback. Set a controller password if desired.
