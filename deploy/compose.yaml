name: super-pi-hole
services:
  super-pi-hole:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.companion
    image: super-pi-hole-companion:0.4.1-test
    restart: unless-stopped
    init: true
    user: '568:568'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '${BIND_IP:-127.0.0.1}:${GUI_PORT:-20721}:8080'
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      DATA_DIR: /data
      STATIC_DIR: /app/standalone-dist
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}'
      SUPER_PIHOLE_PASSWORD: '${SUPER_PIHOLE_PASSWORD:?Set an administrator password}'
      PIHOLE_URL: '${PIHOLE_URL:-}'
      PIHOLE_PASSWORD: '${PIHOLE_PASSWORD:-}'
      PIHOLE_WRITE_ENABLED: '${PIHOLE_WRITE_ENABLED:-false}'
      TZ: '${TZ:-Etc/UTC}'
    volumes:
      - super-pi-hole-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  super-pi-hole-data: {}
