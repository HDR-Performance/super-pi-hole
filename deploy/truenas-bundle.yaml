# LEGACY BUNDLE INSTALL. Prefer truenas.yaml for a direct container installation.
# Upload/extract the runtime bundle before applying this YAML.
# Replace POOL/path, 192.0.2.10, and passwords. 192.0.2.10 is an example, not your NAS.
# This is an ADDITIONAL app. Do not replace your working Pi-hole YAML or volumes.
services:
  init-data:
    image: node:24-bookworm-slim
    user: '0:0'
    restart: 'no'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command: [node, /app/deploy/init-data.mjs]
    volumes:
      - type: bind
        source: /mnt/POOL/apps/super-pi-hole-0.2.0-test
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - super-pi-hole-data:/data
  super-pi-hole:
    image: node:24-bookworm-slim
    user: '568:568'
    restart: unless-stopped
    init: true
    working_dir: /app
    command: [node, server/runtime.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - '192.0.2.10:20721:8080'
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      DATA_DIR: /data
      STATIC_DIR: /app/standalone-dist
      PUBLIC_ORIGIN: 'http://192.0.2.10:20721'
      SUPER_PIHOLE_PASSWORD: 'CHANGE_ME_TO_A_UNIQUE_16_CHARACTER_PASSWORD'
      PIHOLE_URL: 'http://192.0.2.10:20720'
      PIHOLE_PASSWORD: ''
      PIHOLE_WRITE_ENABLED: 'false'
      TZ: Etc/UTC
    volumes:
      - type: bind
        source: /mnt/POOL/apps/super-pi-hole-0.2.0-test
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - super-pi-hole-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  super-pi-hole-data: {}
