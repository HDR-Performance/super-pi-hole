# UPGRADE THE EXISTING pihole APP; do not run a second DNS engine on port 53.
# Stop the old standalone Super Pi Hole companion (port 20721) before applying.
# Reuse your current Super Pi Hole password below. Pi-hole password stays unchanged.
# This template targets the directories supplied for 192.168.0.8.
services:
  backup:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.2-test
    user: '0:0'
    network_mode: host
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH, NET_BIND_SERVICE]
    command: [node, /app/deploy/backup-upgrade.mjs]
    environment:
      SUPER_PIHOLE_PASSWORD: &admin-password 'CHANGE_ME_TO_A_UNIQUE_16_CHARACTER_PASSWORD'
    volumes:
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/config
        target: /source/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/dnsmasq
        target: /source/dnsmasq
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/M1.1/APPS/Super-Pi-Hole/backups
        target: /backups
        bind: {create_host_path: true}
      - type: bind
        source: /mnt/M1.1/APPS/Super-Pi-Hole/data
        target: /data
        bind: {create_host_path: true}
    healthcheck: {disable: true}
  pihole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.2-test
    user: '0:0'
    network_mode: host
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETFCAP, SETGID, SETPCAP, SETUID, SYS_NICE, SYS_TIME]
    group_add: [568]
    depends_on:
      backup: {condition: service_completed_successfully}
    command: [bash, /app/deploy/start-dns.sh]
    environment:
      TZ: America/Los_Angeles
      FTLCONF_dns_listeningMode: all
    volumes:
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/config
        target: /etc/pihole
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/dnsmasq
        target: /etc/dnsmasq.d
        bind: {create_host_path: false}
    shm_size: 64M
    cpus: 2
    mem_limit: 4096M
    healthcheck:
      test: [CMD-SHELL, 'dig +short +norecurse +retry=0 +time=2 @127.0.0.1 pi.hole >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  super-pi-hole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.2-test
    user: '568:568'
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      pihole: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: '20721'
      PUBLIC_ORIGIN: 'http://192.168.0.8:20721'
      SUPER_PIHOLE_PASSWORD: *admin-password
      SUPER_PIHOLE_INTEGRATED: 'true'
      PIHOLE_URL: 'http://127.0.0.1:20720'
      # Existing Pi-hole API password, blank in your supplied working config.
      PIHOLE_PASSWORD: ''
      PIHOLE_WRITE_ENABLED: 'true'
      TZ: America/Los_Angeles
    volumes:
      - type: bind
        source: /mnt/M1.1/APPS/Super-Pi-Hole/data
        target: /data
        bind: {create_host_path: false}
    tmpfs: ['/tmp:size=64m,mode=1777']
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
x-portals:
  - host: 192.168.0.8
    name: Web UI
    path: /
    port: 20721
    scheme: http
x-notes: >
  Super Pi Hole integrated test release. Existing Pi-hole data is reused after
  a verified read-only backup. Open the main GUI using Web UI. The original
  interface is available read-only at /admin/ after signing into Super Pi Hole.
  Application updates come from HDR-Performance/super-pi-hole releases only.
  Live family DNS controls are separate from the policy simulator. Country
  enforcement, bandwidth monitoring and universal block-page redirection are not included.
