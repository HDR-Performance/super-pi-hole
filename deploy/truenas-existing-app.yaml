# Upgrade the existing pihole app on 192.168.0.8; not a fresh-install template.
# Save the current YAML and stop the pihole app before replacing it.
# Keep the old standalone super-pi-hole app STOPPED; do not delete its data volume.
# This local-only profile intentionally disables both web-interface passwords.
# Never expose ports 20720 or 20721 outside the trusted LAN.
services:
  pihole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.3-test
    user: '0:0'
    network_mode: host
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETFCAP, SETGID, SETPCAP, SETUID, SYS_NICE, SYS_TIME]
    group_add: [568]
    command: [bash, /app/deploy/start-dns.sh]
    environment:
      TZ: America/Los_Angeles
      FTLCONF_dns_listeningMode: all
      # Empty disables the original Pi-hole web/API password.
      FTLCONF_webserver_api_password: ''
    volumes:
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/config
        target: /etc/pihole
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/.ix-apps/app_mounts/pihole/dnsmasq
        target: /etc/dnsmasq.d
        bind: {create_host_path: false}
    shm_size: 64M
    cpus: 2
    mem_limit: 4096M
    healthcheck:
      test: [CMD-SHELL, 'dig +short +norecurse +retry=0 +time=2 @127.0.0.1 pi.hole >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  super-pi-hole:
    image: ghcr.io/hdr-performance/super-pi-hole:0.4.3-test
    user: '568:568'
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      pihole: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: '20721'
      PUBLIC_ORIGIN: 'http://192.168.0.8:20721'
      # Set to 'false' and add SUPER_PIHOLE_PASSWORD to restore GUI login.
      SUPER_PIHOLE_AUTH_DISABLED: 'true'
      SUPER_PIHOLE_INTEGRATED: 'true'
      PIHOLE_URL: 'http://127.0.0.1:20720'
      # Empty matches the password-free Pi-hole API configured above.
      PIHOLE_PASSWORD: ''
      PIHOLE_WRITE_ENABLED: 'true'
      TZ: America/Los_Angeles
    volumes:
      - super-pi-hole-data:/data
    tmpfs: ['/tmp:size=64m,mode=1777']
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  super-pi-hole-data:
    external: true
    name: ix-super-pi-hole_super-pi-hole-data
x-portals:
  - host: 192.168.0.8
    name: Web UI
    path: /
    port: 20721
    scheme: http
x-notes: >
  Super Pi Hole 0.4.3-test: one TrueNAS app for DNS and our main GUI.
  Retains the original Pi-hole directories and existing external GUI data volume.
  Do not delete that volume or start the old standalone companion app.
  Take a TrueNAS snapshot before applying; the startup-blocking backup service is omitted.
  Web UI opens the main interface on port 20721. Router DNS remains 192.168.0.8 (port 53).
  Both local web-interface passwords are disabled. Every LAN device reaching ports
  20720 or 20721 has access, so neither port may be forwarded outside the trusted LAN.
  Live family DNS rules are opt-in. Country, bandwidth and universal block-page
  redirection enforcement are not included. This is a testing prerelease.
